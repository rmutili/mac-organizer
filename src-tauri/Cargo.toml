[package]
name = "mac-organizer"
version = "0.1.0"
description = "Organize ~/Downloads with Claude"
authors = ["Raphael Mutili"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mac_organizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
reqwest = { version = "0.13.5", features = ["json"] }
security-framework = "3.7.0"
futures = "0.3.34"
sha2 = "0.11.1"
base64 = "0.23.1"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSFileManager", "NSURL", "NSString", "NSError"] }
tauri-plugin-dialog = "2.8.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
